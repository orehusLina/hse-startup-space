name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: club_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U club" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://club:club@localhost:5432/club_test
        run: pytest -v

  e2e:
    name: E2E (Playwright, main flow)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: club
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U club" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://club:club@localhost:5432/club
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            e2e/requirements.txt
      - run: pip install -r backend/requirements.txt -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start the app with fresh demo data
        working-directory: backend
        run: |
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: pytest e2e
        env:
          BASE_URL: http://localhost:8000
        run: pytest -v e2e
      - name: App log
        if: failure()
        run: cat uvicorn.log
