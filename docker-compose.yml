services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://club:club@db:5432/club
      SEED_ON_START: "true"
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Runs only on demand: docker compose run --rm tests
  tests:
    build: ./backend
    command: ["pytest", "-v"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://club:club@db:5432/club_test
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
