services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://club:club@db:5432/club
      SEED_ON_START: "true"
      DEMO_MODE: "true"
      # Token from @BotFather; read from .env. Without it Telegram login is off and only test accounts work.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # --- Telegram mode: docker compose --profile telegram up --build ---
  # Free temporary https address (no account needed); a new one on every start.
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://api:8000"]
    depends_on: [api]
    profiles: ["telegram"]

  # Waits for the tunnel address and sets it as the bot's "Открыть" button, then exits.
  bot-setup:
    build: ./backend
    command: ["python", "-m", "app.telegram_setup"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TUNNEL_METRICS_URL: http://tunnel:2000/quicktunnel
    depends_on: [tunnel]
    restart: "no"
    profiles: ["telegram"]

  # Runs only on demand: docker compose run --rm tests
  tests:
    build: ./backend
    command: ["pytest", "-v"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://club:club@db:5432/club_test
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
